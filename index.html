
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>10C1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    background: radial-gradient(circle at top, #ff7aa2, #1a001f);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
    transition:1s;
}

/* ===== POWER MODE ===== */
body.power{
    background: radial-gradient(circle at top, #ffd700, #b80000);
}

/* ===== GLOW ===== */
.glow{
    position:absolute;
    width:120%;
    height:120%;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
    animation:pulse 4s infinite alternate;
}

body.power .glow{
    background: radial-gradient(circle, rgba(255,215,0,0.25), transparent 65%);
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* ===== CARD ===== */
.card{
    position:relative;
    background:rgba(0,0,0,0.55);
    border-radius:32px;
    padding:45px 50px;
    width:440px;
    text-align:center;
    backdrop-filter: blur(12px);
    box-shadow:0 30px 60px rgba(0,0,0,0.6);
    animation:appear 1.2s ease;
    z-index:2;
    transition:0.8s;
}

body.power .card{
    background:rgba(255,255,255,0.15);
    box-shadow:0 0 60px rgba(255,215,0,0.9);
}

@keyframes appear{
    from{transform:translateY(40px) scale(0.8);opacity:0;}
    to{transform:translateY(0) scale(1);opacity:1;}
}

.badge{
    display:inline-block;
    padding:7px 18px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff4d6d,#ff9aa2);
    font-weight:600;
    margin-bottom:14px;
    transition:0.6s;
}

body.power .badge{
    background:linear-gradient(135deg,#ffd700,#ff8c00);
    color:#600;
}

h1{
    font-size:32px;
    margin-bottom:10px;
    background:linear-gradient(135deg,#ffd6e0,#ff4d6d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    transition:0.6s;
}

body.power h1{
    background:linear-gradient(135deg,#fff3b0,#ff8c00);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h2{
    font-size:18px;
    color:#ffd6e0;
    margin-bottom:20px;
}

body.power h2{
    color:#fff3b0;
}

p{
    font-size:17px;
    line-height:1.7;
    color:#f3f3f3;
    transition:0.6s;
}

.highlight{
    font-weight:700;
    color:#ff9aa2;
}

body.power .highlight{
    color:#ffd700;
}

/* ===== BUTTON ===== */
.btn{
    margin-top:24px;
    padding:14px 36px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#ff4d6d,#ff9aa2);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.1);
}

body.power .btn{
    background:linear-gradient(135deg,#ffd700,#ff8c00);
    color:#600;
    box-shadow:0 0 25px rgba(255,215,0,0.9);
}

/* ===== EFFECT ===== */
.spark{
    position:absolute;
    font-size:18px;
    animation:rise linear forwards;
    pointer-events:none;
}

@keyframes rise{
    from{transform:translateY(100vh) scale(0.6);opacity:0;}
    to{transform:translateY(-10vh) scale(1.3);opacity:1;}
}

.footer{
    margin-top:18px;
    font-size:13px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">
    <div class="badge" id="badge">✨ Hùng 10C1 ✨</div>

    <h1 id="title">10C1 – Chuẩn bị trc khi thi đấu</h1>
    <h2 id="sub">Gửi các bạn nữ lớp 10C1</h2>

    <p id="text">
        Ra sân với tinh thần<br>
        <span class="highlight">tự tin</span> –
        <span class="highlight">đoàn kết</span> –
        <span class="highlight">cháy hết mình</span> 🔥<br><br>

        Không cần nói trước kết quả,<br>
        chỉ cần <span class="highlight">nhưng ra sân là phải đá hết sức</span>.
    </p>

    <button class="btn" onclick="togglePower()">BẬT CHẾ ĐỘ  🔥</button>

    <div class="footer" id="footer">
        10C1 – Chưa đá nhưng tinh thần phải cao 😎
    </div>
</div>

<script>
let power=false;

function togglePower(){
    power=!power;
    document.body.classList.toggle("power");

    if(power){
        document.getElementById("title").innerHTML="🔥POWER MODE ACTIVATED 🔥";
        document.getElementById("sub").innerHTML="Tinh thần đã được kích hoạt";
        document.getElementById("text").innerHTML=`
            Đã <span class="highlight">dám bật chế độ</span> rồi thì<br>
            là phải <span class="highlight">chơi hết mình</span> 💪🔥<br><br>

            Không áp lực – không sợ hãi,<br>
            <span class="highlight">đã bật là phải thắng đó nè 😤🔥</span>
        `;
        document.getElementById("footer").innerHTML=
            "10C1 – Bật mode rồi là không được sợ 😎🔥";
    }else{
        document.getElementById("title").innerHTML="10C1 – READY TO SHINE";
        document.getElementById("sub").innerHTML="Gửi các bạn nữ lớp 10C1";
        document.getElementById("text").innerHTML=`
            Ra sân với tinh thần<br>
            <span class="highlight">tự tin</span> –
            <span class="highlight">đoàn kết</span> –
            <span class="highlight">cháy hết mình</span> 🔥<br><br>

            Không cần nói trước kết quả,<br>
            chỉ cần <span class="highlight">10C1 là phải rực</span>.
        `;
        document.getElementById("footer").innerHTML=
            "10C1 – Chưa đá nhưng tinh thần phải cao 😎";
    }
}

function spark(){
    const s=document.createElement("div");
    s.className="spark";
    s.innerHTML=power?"🔥":"💥";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(16+Math.random()*22)+"px";
    s.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),6000);
}

setInterval(spark,250);
</script>

</body>
  </html>
